---

# This yaml file defines some meta data that will be used for test,
# release, deployment, etc tasks.

release:
  changelog_dir: changelogs

  findreplace:
    - file: package.json
      pattern: '"version": "\d+\.\d+\.\d+"'
      replacement: '"version": "{{ version }}"'
      num_expected: 1

    - file: resources/static/scripts/constants/appState.js
      pattern: 'WEB_CHAT_VERSION = "\d+\.\d+\.\d+"'
      replacement: 'WEB_CHAT_VERSION = "{{ version }}"'
      num_expected: 1
