<!DOCTYPE html>
<html>
  <head>
  </head>
  <body>
    <script>
      // This HTML file would be loaded via the old (plat_id not truncated)
      // URL of the iframe.
      // This script is responsible for sending the old iframe's localStorage
      // data to the new iframe (with truncated plat_id) via the postMessage API.
      // The new iframe's app logic should listen to this message and update its
      // localStorage.
      // @TODO: Post message only to the new iframe (with truncated plat_id)
      window.parent.postMessage (JSON.stringify ({
        type: "MIGRATE_LS",
        data: localStorage
      }), "*");
    </script>
  </body>
</html>
