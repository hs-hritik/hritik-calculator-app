<html>
  <head>
    <title><%= fontName %></title>
    <style>
      @font-face {
        font-family: "<%= fontName %>";
        src: url("<%= fontPath %><%= fontName %>.eot");
        src: url("<%= fontPath %><%= fontName %>.eot?#iefix") format("eot"),
        url("<%= fontPath %><%= fontName %>.woff") format("woff"),
        url("<%= fontPath %><%= fontName %>.ttf") format("truetype"),
        url("<%= fontPath %><%= fontName %>.svg#<%= fontName %>") format("svg");
        font-weight: normal;
        font-style: normal;
      }

      body {
        font-family: Gill Sans;
        text-align: center;
        background: #f7f7f7;
      }

      body > h1 {
        color: #666;
        margin: 1em 0;
        text-transform: capitalize;
      }

      .glyph {
        padding: 0;
      }

      .glyph > li {
        display: inline-block;
        margin: .3em .2em;
        width: 5em;
        height: 6.5em;
        background: #fff;
        border-radius: .5em;
        position: relative;
      }

      .glyph > li .s {
        display: block;
        margin-top: .1em;
        line-height: 0;
      }

      .glyph-name {
        font-size: .8em;
        color: #666;
        display: block;
      }

      .glyph-codepoint {
        color: #999;
        font-family: monospace;
      }

      .<%= className %>:before {
        display: inline-block;
        font-family: "<%= fontName %>";
        font-style: normal;
        font-weight: normal;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .<%= className %>-lg {
        font-size: 1.3333333333333333em;
        line-height: 0.75em;
        vertical-align: -15%;
      }
      .<%= className %>-2x { font-size: 2em; }
      .<%= className %>-3x { font-size: 3em; }
      .<%= className %>-4x { font-size: 4em; }
      .<%= className %>-5x { font-size: 5em; }
      .<%= className %>-fw {
        width: 1.2857142857142858em;
        text-align: center;
      }
<% _.each(glyphs, function(glyph) { %>
      .<%= className %>-<%= glyph.name %>:before {
        content: "\<%= glyph.codepoint.toString(16).toUpperCase() %>";
      }
<% }); %>
    </style>
  </head>
  <body>
    <h1><%= fontName %></h1>
    <ul class="glyph"><% _.each(glyphs, function(glyph) { %>
      <li>
        <i class="<%= className %> <%= className %>-<%= glyph.name %> <%= className %>-4x"></i>
        <span class="glyph-name"><%= glyph.name %></span>
        <span class="glyph-codepoint"><%= glyph.codepoint.toString(16).toUpperCase() %></span>
      </li><% }); %>
    </ul>
  </body>
</html>
