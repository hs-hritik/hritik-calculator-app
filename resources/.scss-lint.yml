severity: error
linters:
  BemDepth:
    enabled: true
    max_elements: 1
  ColorKeyword:
    enabled: false
  ColorVariable:
    enabled: false
  DuplicateProperty:
    ignore_consecutive:
      - background
      - transition
  ImportantRule:
    enabled: false
  Indentation:
    enabled: true
    allow_non_nested_indentation: false
    character: space # or 'tab'
    width: 2
  HexLength:
    enabled: true
    style: short
  NestingDepth:
    enabled: true
    max_depth: 6
    ignore_parent_selectors: false
  SelectorDepth:
    enabled: true
    max_depth: 5
  SelectorFormat:
    enabled: true
    convention: hyphenated_BEM
    ignored_names:
      - Component
  StringQuotes:
    enabled: true
    style: double_quotes
  QualifyingElement:
    enabled: false
  VariableForProperty:
    enabled: true
    properties:
      - color
      - font
  PropertySortOrder:
    order:
    - position
    - top
    - right
    - bottom
    - left
    - z-index
    - display
    - align-content
    - align-items
    - align-self
    - flex
    - flex-basis
    - flex-direction
    - flex-flow
    - flex-grow
    - flex-shrink
    - flex-wrap
    - justify-content
    - order
    - float
    - width
    - height
    - max-width
    - max-height
    - min-width
    - min-height
    - padding
    - padding-top
    - padding-right
    - padding-bottom
    - padding-left
    - margin
    - margin-top
    - margin-right
    - margin-bottom
    - margin-left
    - margin-collapse
    - margin-top-collapse
    - margin-right-collapse
    - margin-bottom-collapse
    - margin-left-collapse
    - overflow
    - overflow-x
    - overflow-y
    - clip
    - clear
    - font
    - font-family
    - font-size
    - font-smoothing
    - osx-font-smoothing
    - font-style
    - font-weight
    - hyphens
    - src
    - line-height
    - letter-spacing
    - word-spacing
    - color
    - text-align
    - text-decoration
    - text-indent
    - text-overflow
    - text-rendering
    - text-size-adjust
    - text-shadow
    - text-transform
    - word-break
    - word-wrap
    - white-space
    - vertical-align
    - list-style
    - list-style-type
    - list-style-position
    - list-style-image
    - pointer-events
    - cursor
    - background
    - background-attachment
    - background-color
    - background-image
    - background-position
    - background-repeat
    - background-size
    - border
    - border-collapse
    - border-top
    - border-right
    - border-bottom
    - border-left
    - border-color
    - border-image
    - border-top-color
    - border-right-color
    - border-bottom-color
    - border-left-color
    - border-spacing
    - border-style
    - border-top-style
    - border-right-style
    - border-bottom-style
    - border-left-style
    - border-width
    - border-top-width
    - border-right-width
    - border-bottom-width
    - border-left-width
    - border-radius
    - border-top-right-radius
    - border-bottom-right-radius
    - border-bottom-left-radius
    - border-top-left-radius
    - border-radius-topright
    - border-radius-bottomright
    - border-radius-bottomleft
    - border-radius-topleft
    - content
    - quotes
    - outline
    - outline-offset
    - outline-width
    - outline-style
    - outline-color
    - opacity
    - filter
    - visibility
    - size
    - zoom
    - transform
    - box-align
    - box-flex
    - box-orient
    - box-pack
    - box-shadow
    - box-sizing
    - table-layout
    - animation
    - animation-delay
    - animation-duration
    - animation-iteration-count
    - animation-name
    - animation-play-state
    - animation-timing-function
    - animation-fill-mode
    - transition
    - transition-delay
    - transition-duration
    - transition-property
    - transition-timing-function
    - background-clip
    - backface-visibility
    - resize
    - appearance
    - user-select
    - interpolation-mode
    - direction
    - marks
    - page
    - set-link-source
    - unicode-bidi
    - speak
  PropertyUnits:
    global: ["px", "%", "s"] # Allow relative units globally
    properties:
      border: ["px"] # Only pixels
      width: ["px", "%", "vh", "vw", "vmin", "vmax"]
      height: ["px", "%", "vh", "vw", "vmin", "vmax"]
      line-height: [] # No units allowed
      margin: ["px", "rem"]
      top: ["px", "em", "%"]
