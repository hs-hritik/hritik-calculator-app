sonar.projectKey=com.helpshift:mirkwood
# Must be unique in a given SonarQube instance
sonar.projectKey=mirkwood
# This is the name and version displayed in the SonarQube UI.
# Was mandatory prior to SonarQube 6.1.
sonar.projectName=Mirkwood
# sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
# This property is optional if sonar.modules is set.
sonar.sources=.

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

sonar.host.url=http://192.168.33.45:9000

# exclude js libs from analysis, relative to the project root dir
# @TODO: Add more dirs/files to this
sonar.exclusions=node_modules/**/*
